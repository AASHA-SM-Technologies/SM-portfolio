    <!-- Instant Theme Initializer (Defaults to Light for first-time visitors) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio_theme');
          var theme = saved || 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
